# Render blueprint: a free web service that runs the demo from this repo.
# In Render: New → Blueprint → connect the GitHub repo → it reads this file.
#
# One worker on purpose. The case book lives in the process's memory and is
# mirrored to SQLite; a second worker would have its own copy and the two
# would drift apart. Threads serve concurrent visitors within the one worker.
# The free plan's disk is wiped on every deploy and restart, which only
# brings the seeded case book back — the same thing "Reset demo" does.
services:
  - type: web
    name: fincrime-hub-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # Model assessment: Claude through Straive's LLM Foundry. Render asks
      # for the key when the blueprint is applied; blank runs without it.
      - key: LLM_FOUNDRY_KEY
        sync: false
      - key: LLM_FOUNDRY_URL
        value: https://llmfoundry.straivedemo.com
      - key: LLM_MODEL
        value: claude-opus-4-8
